<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>History Topic 5 — Flashcards v2 (Section Recall)</title>
<style>
  :root{
    --bg:#0f1220; --panel:#1a1e31; --card:#232842; --cardback:#2c3154;
    --text:#e8eaf6; --muted:#9aa0c3; --accent:#6c7bff; --accent2:#4ade80;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);
    color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
  h1{font-size:1.4rem;font-weight:700;margin-bottom:2px}
  .sub{color:var(--muted);font-size:.85rem;margin-bottom:20px}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
  select,button{background:var(--panel);color:var(--text);border:1px solid #323a5e;border-radius:8px;
    padding:8px 14px;font-size:.9rem;cursor:pointer}
  button:hover{background:#262c4c}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .counter{color:var(--muted);font-size:.85rem}
  .stage{width:100%;max-width:640px;perspective:1200px;margin-bottom:18px}
  .card{position:relative;width:100%;height:420px;cursor:pointer;transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.2,.7,.3,1)}
  .card.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:16px;display:flex;flex-direction:column;padding:26px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden}
  .front{background:var(--card);align-items:center;justify-content:center;text-align:center}
  .back{background:var(--cardback);transform:rotateY(180deg);justify-content:flex-start}
  .cat{position:absolute;top:14px;left:14px;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
    color:var(--accent2);background:rgba(74,222,128,.12);padding:4px 10px;border-radius:20px;font-weight:600}
  .q{font-size:1.3rem;font-weight:700;line-height:1.4;max-width:92%}
  .a{font-size:.93rem;line-height:1.55;color:#dfe3ff;text-align:left;white-space:pre-wrap;width:100%;
    overflow-y:auto;margin-top:26px}
  .a::-webkit-scrollbar{width:6px}.a::-webkit-scrollbar-thumb{background:#4a5280;border-radius:3px}
  .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:var(--muted);font-size:.72rem}
  .nav{display:flex;gap:10px;align-items:center}
  @media(max-width:480px){.card{height:400px}.q{font-size:1.15rem}.a{font-size:.87rem}}
</style>

<body>
  <h1>History Topic 5 — Flashcards v2</h1>
  <div class="sub">Section recall · read the heading, recall the section, flip to check — pp. 5–30</div>

  <div class="controls">
    <select id="catFilter" onchange="applyFilter()">
      <option value="all">All sections</option>
    </select>
    <button id="shuffle" class="primary" onclick="shuffle()">Shuffle</button>
  </div>

  <div class="stage">
    <div class="card" id="card" onclick="flip()">
      <div class="face front">
        <span class="cat" id="catFront"></span>
        <div class="q" id="q"></div>
        <span class="hint">Recall the details of this section — then click / Space to flip</span>
      </div>
      <div class="face back">
        <span class="cat" id="catBack"></span>
        <div class="a" id="a"></div>
      </div>
    </div>
  </div>

  <div class="nav">
    <button onclick="move(-1)">← Prev</button>
    <span class="counter" id="counter"></span>
    <button onclick="move(1)">Next →</button>
  </div>

<script>
const DECK = [
// ===================== RENAISSANCE =====================
{cat:"Renaissance", f:`The Renaissance (14th–16th centuries)`, b:`The Renaissance began in Italy in the 14th century and later spread to other European countries.
The word "Renaissance" means "rebirth" or "revival". It refers to the renewed interest of Europeans in the classical culture of ancient Greece and Rome.
The medieval times thus ended and European culture entered a new era.`},
{cat:"Renaissance", f:`Background — Collapse of feudal society`, b:`In the late medieval times, feudal society gradually collapsed. Many serfs moved from the manors to the cities. They were no longer tied to their lords and could choose their own work, such as artistic creation.
The relatively liberal social atmosphere was favourable for the development of new ideas and culture.`},
{cat:"Renaissance", f:`Background — Rise of merchants`, b:`After the Crusades (1096–1270), trade between the East and the West flourished. Italian merchants controlled the trade routes in the Mediterranean. City-states like Florence and Venice became trading centres and earned huge profits.
Rich merchants (e.g. the Medici family) pursued a material life. They generously sponsored literary and artistic creations, which promoted the development of the Renaissance.`},
{cat:"Renaissance", f:`Background — Classical civilisation regaining importance`, b:`Through the Crusades and trade, Europeans came into contact with the findings of Islamic scholars on classical civilisation. After the fall of the Eastern Roman Empire, many scholars fled to Italy with their ancient manuscripts; this led to a renewed interest in classical civilisation among Europeans.
In addition, the rise of universities brought about a more liberal academic environment. Knowledge, such as philosophy, was highly valued. The invention of the movable-type printing press sped up the spread of knowledge and further promoted the Renaissance.`},
{cat:"Renaissance", f:`Exploring classical civilisation — Collecting ancient texts (Petrarch)`, b:`Many scholars were keen to collect ancient texts. For example, Petrarch, the "father of humanism" (1304–1374), spent four years travelling everywhere to collect ancient manuscripts.`},
{cat:"Renaissance", f:`Exploring classical civilisation — Setting up schools`, b:`Many rich Italians set up schools and invited scholars to study classical civilisation. For example, the Medici family followed the ancient Greek philosopher Plato and founded the "Neo-Platonic Academy".`},
{cat:"Renaissance", f:`The Medici family`, b:`The late medieval times saw the rise of many powerful families, such as the Medici family from Florence. They made their fortune in banking and engaged in cloth production and the real estate business.
Between the 15th and 18th centuries, several members of the family became the rulers of Florence, as well as four popes and two queens of France. The most famous member, Lorenzo de' Medici (1449–1492), had close ties to many artists and loved collecting ancient books and works of art. He was an important contributor to the Renaissance.
The Uffizi Gallery preserves the collection of the Medici family.`},
{cat:"Renaissance", f:`Why Italy? — Geography`, b:`Advantage: Italian cities were close to the Mediterranean, making it easier to reach the East.
Effect: They obtained ancient texts from Islamic countries and the Eastern Roman Empire to promote the study of classical civilisation.`},
{cat:"Renaissance", f:`Why Italy? — Politics`, b:`Advantage: Italian cities were mostly city-states, where citizens enjoyed greater freedoms.
Effect: A liberal social atmosphere was favourable for the development of new ideas.`},
{cat:"Renaissance", f:`Why Italy? — Economy`, b:`Advantage: Most Italian cities were important centres of trade and traded by sea and got rich.
Effect: Rich merchants were willing to sponsor literary and artistic creations.`},
{cat:"Renaissance", f:`Why Italy? — Culture`, b:`Advantage: They had a long history. Italy was the birthplace of the ancient Roman civilisation. There were a large number of historical remains.
Effect: The Italians saw themselves as the successors of ancient Roman civilisation and were keen to study it.`},
{cat:"Renaissance", f:`Characteristic 1 — Revival of classical civilisation`, b:`During the Renaissance, Europeans learnt and promoted many ancient Greco-Roman ideas. They not only appreciated and preserved the ancient heritage, but also explored its foundations, and brought innovations to architecture, painting and sculpture.`},
{cat:"Renaissance", f:`Characteristic 2 — Emphasis on humanism`, b:`People valued humanism. They advocated a human-centred approach, affirmed the talents and values of human beings, and focused on this life. This broke away from the God-centred thinking that had existed since the medieval times.
Artists expressed humanism in different forms. For example, literary works described life and human nature; paintings and sculptures depicted the human body.`},
{cat:"Renaissance", f:`Characteristic 3 — Individualism and scepticism`, b:`People pursued individualism and believed that they should stay true to themselves and express their opinions and feelings freely.
With great scepticism they dared to question old ideas and experiment with new things.`},
{cat:"Renaissance", f:`What is humanism?`, b:`The term "humanism" comes from the Latin word "humanitas". It emphasises the dignity and status of human beings. All value judgements are human-centred, in contrast to the God-centred religious thinking of the medieval times.`},
{cat:"Renaissance", f:`Literature — overview`, b:`Renaissance started from literature. Dante and other literati valued human nature and were no longer limited to religious themes. They wrote about life and the things around them. Some writers wrote in local languages in order to attract more readers.`},
{cat:"Renaissance", f:`Dante (1265–1321)`, b:`His masterpiece, the Divine Comedy (poem), criticises various problems of the medieval Church and satirises human nature.`},
{cat:"Renaissance", f:`Boccaccio (1313–1375)`, b:`His masterpiece, the Decameron (a collection of short stories), describes society during the Black Death epidemic and reveals the darkness of the aristocracy and monks.`},
{cat:"Renaissance", f:`Cervantes (1547–1616)`, b:`His masterpiece, Don Quixote (novel), satirises the aristocracy and the Church at that time.`},
{cat:"Renaissance", f:`Shakespeare (1564–1616)`, b:`British. He wrote many famous plays such as Romeo and Juliet. His works are emotionally complex and portray human nature in depth.`},
{cat:"Renaissance", f:`Painting — theme and style`, b:`Religion was still the main theme of Renaissance art, but other themes like life and natural landscapes also gained importance.
In order to present the themes naturally and accurately, artists focused on observing the structure of the human body and the laws of nature. They adopted new painting techniques, such as the use of perspective and changes in light and shade, to increase the sense of space and the three-dimensional effect.`},
{cat:"Renaissance", f:`Renaissance painting — characteristics`, b:`Theme: religion, people's lives, landscapes.
Character: detailed and realistic depiction of the face and muscles.
Style: rich colours; use of perspective (the principle of "far small, near big") to create clear layers; clear changes in light and shade with a three-dimensional effect; detailed drawing of different materials.
Example: "Madonna and Child".`},
{cat:"Renaissance", f:`Medieval painting — characteristics`, b:`Theme: mainly religion.
Character: blank expressions and stiff movements.
Style: monotonous colours; relatively flat; the size of the figure is out of proportion; less obvious changes in light and shade.
Example: "Virgin of Vladimir".`},
{cat:"Renaissance", f:`The Three Masters of the Renaissance`, b:`Leonardo da Vinci, Michelangelo and Raphael were the three most outstanding artists of their time. They applied new painting techniques and left behind many artistic classics with very different styles that inspired later generations.`},
{cat:"Renaissance", f:`Leonardo da Vinci (1452–1519)`, b:`Da Vinci was an accomplished painter, sculptor, musician, architect, scientist and philosopher. He was full of curiosity and learnt to paint through observation and dissection. He also came up with ideas about some mechanical devices.
Famous works: Mona Lisa, The Last Supper, Vitruvian Man. He used a soft hazy silhouette ("sfumato") and perspective.`},
{cat:"Renaissance", f:`Michelangelo (1475–1564)`, b:`Michelangelo was a famous sculptor, painter and architect. He focused on portraying athletic figures, making the characters extremely lively.`},
{cat:"Renaissance", f:`Raphael (1483–1520)`, b:`Raphael was an expert in painting. He died at the age of 37, but he left behind a large number of works, most notably the Madonna (Virgin Mary). His paintings are known for the beauty of their figures and the harmony of their images.
The School of Athens depicts many great men of ancient times, such as Plato, Aristotle and Euclid.`},
{cat:"Renaissance", f:`Sculpture`, b:`In the medieval times, sculpture was mostly an additional decoration to buildings. It was not until the Renaissance that freestanding sculptures became popular again. Referring to the style of classical civilisation, artists like Michelangelo made sculptures in bronze or marble. They portrayed expressions, movements and human bodies carefully, and their products looked very realistic.
Michelangelo's "Pietà" depicts the Virgin Mary holding the body of Jesus after his death.
Michelangelo's "David" depicts the biblical story of David, the king of Israel, who fought Goliath in his youth.`},
{cat:"Renaissance", f:`Architecture — the Gothic style`, b:`The Gothic style of architecture was popular in the medieval times. Common features included pointed arches, long narrow windows and soaring spires.
Example: Cologne Cathedral — located in Germany, built in 1248, a typical Gothic building.`},
{cat:"Renaissance", f:`Architecture — the Renaissance style`, b:`During the Renaissance, architects looked to ancient Greek and Roman architecture for inspiration and used designs such as columns, arches and domes. They also emphasised proportion, balance and symmetry. They applied the proportions of the human body to architecture for overall harmony and simplicity.
St Peter's Basilica is a classic example of Renaissance architecture. Located in the Vatican City, it was built in 1506 and designed by famous architects such as Raphael and Michelangelo.`},
{cat:"Renaissance", f:`Impact 1 — Leading to the Reformation`, b:`The Renaissance fostered scepticism. People even dared to challenge the authority of the Church. In 1517, Martin Luther openly criticised the Church.`},
{cat:"Renaissance", f:`Impact 2 — Promoting the opening of new sea routes`, b:`During the Renaissance, Europeans regained access to the ancient Greeks' advanced knowledge of astronomy and geography. They applied it to navigation. Since the 15th century, they had made many voyages and discovered many new routes, leading to the opening of new sea routes.`},
{cat:"Renaissance", f:`Impact 3 — Giving rise to the Scientific Revolution`, b:`There was academic freedom during the Renaissance. Under the influence of humanism, people began to study human beings and natural things. Through observations and experiments, they made inventions that led to the Scientific Revolution in the 16th century.`},
{cat:"Renaissance", f:`Impact 4 — Triggering the Enlightenment`, b:`The individualism and scepticism of the Renaissance changed the minds of people between the 17th and 18th centuries. Thinkers emphasised reason and valued concepts such as human rights and freedom, which promoted political changes in European countries.`},

// ===================== REFORMATION =====================
{cat:"Reformation", f:`The Reformation (16th century) — overview`, b:`The "Reformation" of the 16th century was a movement to reform the Roman Catholic Church. It inherited the scepticism of the Renaissance and further changed the minds of Europeans.`},
{cat:"Reformation", f:`Cause — The Church's malpractices (corruption)`, b:`In the late medieval times, the Roman Catholic Church was extremely powerful. The clergy gradually became corrupt. They lived in luxury and made money by improper means, e.g. selling the priesthood.`},
{cat:"Reformation", f:`Cause — The sale of indulgences`, b:`The Church sold indulgences in order to build St Peter's Basilica. It claimed that those who bought them could have their sins forgiven and go to heaven after death.
Influenced by the Renaissance, people began to criticise the Church's malpractices. In addition, some kings also supported such criticism to weaken the influence of the Church.`},
{cat:"Reformation", f:`Cause — Martin Luther and the Ninety-Five Theses (1517)`, b:`In 1517, a German priest Martin Luther posted the Ninety-Five Theses on the main gate of a church in Wittenberg. He openly criticised the malpractices of the Church, which caused great reactions. The Reformation thus began.`},
{cat:"Reformation", f:`The movable-type printing press (Gutenberg, 1450)`, b:`In the medieval times, most books were copied by hand, which was slow and expensive. In 1450, the German Gutenberg invented the movable-type printing press. Together with movable metal letters, he produced the Gutenberg Bible.
Movable-type printing was cheap and fast. It soon became popular in Europe, accelerating the spread of ideas. It allowed the Ninety-Five Theses to spread rapidly throughout Europe and promoted the Reformation.`},
{cat:"Reformation", f:`Martin Luther's stand (1518–1520)`, b:`In 1518, the Roman Catholic Church questioned Martin Luther, but he was determined not to change his mind.
In 1520, the Church ordered Martin Luther to take back his speech, or else he would be excommunicated. Martin Luther then burnt the Church's documents and broke with the Roman Catholic Church.`},
{cat:"Reformation", f:`Luther's belief vs the Church`, b:`The Church: "The authority of the Church is God-given and cannot be questioned!"
Martin Luther: "The Bible is the only authority. Believing in the Bible is enough!"`},
{cat:"Reformation", f:`Luther translates the Bible into German`, b:`Martin Luther hid in a noble's castle and translated the Bible into German. In this way, people could read the Bible without the help of the Church.`},
{cat:"Reformation", f:`Development — Founding of the Protestant Church (Lutheranism)`, b:`Although Martin Luther was excommunicated, his supporters continued to grow. His ideas spread widely, forming a new sect called "Lutheranism".
After Lutheranism, other new sects (e.g. Anglican Church and Calvinism) dissatisfied with the Roman Catholic Church were founded in Europe. They are collectively known as "Protestantism".`},
{cat:"Reformation", f:`Lutheranism's key teaching`, b:`Lutheranism emphasises reliance on the Bible and advocates that salvation can only be achieved by believing in God's grace.`},
{cat:"Reformation", f:`The Anglican Church (Henry VIII, 1534)`, b:`The Roman Catholic Church opposed the remarriage of King Henry VIII of England, so he broke with the Church in 1534. He founded the Anglican Church as the state religion of England and made himself its supreme leader.`},
{cat:"Reformation", f:`Calvinism (Calvin)`, b:`Calvin established Calvinism in Switzerland, which advocated a frugal life and had very strict rules.`},
{cat:"Reformation", f:`Reform of the Roman Catholic Church (Counter-Reformation)`, b:`In order to regain people's confidence, the Roman Catholic Church decided to clarify doctrines and set the direction for reforms, e.g. banning the sale of indulgences and the priesthood, setting up schools to nurture priests.
The Jesuits (Society of Jesus) was created in 1534 to preach Catholic doctrines. The Church also issued a catalogue to ban Protestant books and set up the Roman Inquisition to judge heretics.`},
{cat:"Reformation", f:`Impact 1 — Weakening the Roman Catholic Church`, b:`Protestantism continued to grow after the Reformation. Some European monarchs also seized the opportunity to recover their power and promote the separation of church and state. The Roman Catholic Church no longer had absolute power, and its influence was not what it used to be.`},
{cat:"Reformation", f:`Impact 2 — Leading to religious wars`, b:`European countries split into Catholic and Protestant factions. They were hostile to each other, which triggered religious wars. The largest one was the Thirty Years' War (1618–1648). All the states were plunged into chaos and suffered heavy casualties.`},
{cat:"Reformation", f:`Impact 3 — Promoting the development of ideas (Peace of Westphalia)`, b:`In 1648, the Thirty Years' War ended with the signing of the Peace of Westphalia. Protestant and Roman Catholic churches gradually accepted each other and allowed each state to determine its state religion.
In addition, different factions actively spread their ideas by running schools, allowing more Europeans to receive education and promoting the spread of knowledge.`},
{cat:"Reformation", f:`Development of Christianity (family tree)`, b:`Christianity → (11th century Great Schism) → Eastern Orthodox Church / Roman Catholic Church.
Roman Catholic Church → (16th century Reformation) → Lutheranism + Anglican Church + Calvinism (collectively Protestantism).`},

// ===================== SINO-WESTERN EXCHANGE =====================
{cat:"Sino-Western", f:`Jesuit priests coming to China — overview`, b:`The Jesuits were founded in 1534 and approved by the Pope as an official Catholic religious order in 1540. Jesuit priests travelled around the world to preach and bring Western knowledge of geography and natural science to China.
During the Ming and Qing Dynasties, Western missionaries introduced Western scientific knowledge to the emperors and officials, promoting cultural exchange between China and the West.`},
{cat:"Sino-Western", f:`Matteo Ricci (利瑪竇)`, b:`Late Ming Dynasty. Contributions: translated with Xu Guangqi the ancient Greek mathematical text, Elements; drew a complete map of the world, Kunyu Wanguo Quantu.`},
{cat:"Sino-Western", f:`Adam Schall (湯若望)`, b:`Late Ming and early Qing Dynasties. Contributions: served as Qin Tianjian and introduced Western astronomical knowledge; introduced the telescope to China.`},
{cat:"Sino-Western", f:`Ferdinand Verbiest (南懷仁)`, b:`Early Qing Dynasty. Contributions: served as Qin Tianjian and introduced Western astronomical knowledge; introduced Western artillery technology and assisted the Qing court in making firearms.`},
{cat:"Sino-Western", f:`Banning religion in China`, b:`The Jesuit priests saw no conflict between the Chinese tradition of ancestor worship and Catholic teachings, but other religious orders saw it as a violation of Catholic rules. Later, the Pope forbade Chinese believers to participate in the rituals. The Chinese imperial court also forbade the spread of Christianity in China in the early Qing Dynasty. After that, fewer priests came to China.`},

// ===================== SCIENTIFIC REVOLUTION =====================
{cat:"Scientific Revolution", f:`Key word — "Revolution" (definition)`, b:`It refers to major changes in the way of human life, including fundamental changes in politics, culture, science and technology.`},
{cat:"Scientific Revolution", f:`Background of the Scientific Revolution`, b:`1. The Renaissance emphasised reason.
2. The Reformation began to question the authority of the Church.
3. The opening of new sea routes challenged old world views and allowed scientists to rediscover how the natural world worked.
From the 16th century onwards, scientists came up with many new scientific theories and overthrew old ideas. This is known as the "Scientific Revolution".`},
{cat:"Scientific Revolution", f:`Characteristic 1 — Searching for the laws of nature (Descartes)`, b:`Scholars believed that there were laws governing the workings of nature. For example, the French scholar René Descartes put forward the theory of "Mechanism": he believed that everything worked like a machine, in accordance with the established laws of nature. They tried to find out the laws through rational thought and explain the complexity of natural phenomena.`},
{cat:"Scientific Revolution", f:`Characteristic 2 — Emphasis on observations and experiments (Bacon)`, b:`Scientists at that time practised rationalism and put emphasis on observations and experiments. For example, the English scholar Francis Bacon believed that humans could understand the world through "empirical evidence", which laid the foundation for the emergence of the scientific method.
Scientists invented new scientific instruments, such as microscopes, telescopes and barometers, which led to more scientific discoveries.`},
{cat:"Scientific Revolution", f:`New instrument — Barometer (Torricelli, 1643)`, b:`In 1643, the Italian scientist Evangelista Torricelli discovered the principle of air pressure. He made a mercury barometer to measure atmospheric pressure. Changes in air pressure cause the mercury to rise and fall.`},
{cat:"Scientific Revolution", f:`New instrument — Microscope (Leeuwenhoek, 1670s)`, b:`In the 1670s, the Dutch scientist Antonie Van Leeuwenhoek discovered microorganisms with his home-made microscope.`},
{cat:"Scientific Revolution", f:`The scientific method`, b:`It is a set of methods for conducting scientific research: observation, hypothesis, experiment and analysis. By repeating these steps, objective conclusions can be drawn.
Example of deduction:
Premise 1: All fish have gills.
Premise 2: Sharks are fish.
Conclusion: Sharks have gills.`},
{cat:"Scientific Revolution", f:`Astronomy — from geocentrism to heliocentrism`, b:`In the medieval times, the "geocentric model" was the general view: the earth was the centre of the universe, held as truth by the Church.
During the Scientific Revolution, astronomers like Nicolaus Copernicus and Galileo Galilei put forward the theory of "heliocentrism": the sun was the centre of the planets. This broke down the common misconception and started a new direction in astronomical research.`},
{cat:"Scientific Revolution", f:`Aristarchus (ancient Greece)`, b:`The first known astronomer to propose heliocentrism was Aristarchus of ancient Greece, but his view was not taken seriously at that time.`},
{cat:"Scientific Revolution", f:`Copernicus (1543)`, b:`In 1543, the Polish scientist Copernicus published his book On the Revolutions of the Heavenly Spheres. However, his theory was not mature enough to explain some of the problems.`},
{cat:"Scientific Revolution", f:`Kepler (1609–1618)`, b:`Between 1609 and 1618, the German scientist Johannes Kepler proposed three laws of planetary motion, which supplemented some shortcomings of Copernicus' theory — the planets revolve around the sun in an oval orbit.`},
{cat:"Scientific Revolution", f:`Galileo`, b:`Galileo, an Italian scientist of Kepler's time, improved the telescope and observed many phenomena that supported the heliocentric theory. For example, the waxing and waning phases of Venus prove that it orbits the sun.`},
{cat:"Scientific Revolution", f:`Medicine — Vesalius and Harvey`, b:`Medical scientists gained a deeper understanding of the human body through dissection. In 1543, the Italian Andreas Vesalius published the first comprehensive textbook on anatomy. William Harvey discovered the blood circulation system and published On the Motion of the Heart and Blood in Animals, which disproved some of the old medical theories.`},
{cat:"Scientific Revolution", f:`Physics — Isaac Newton (Principia, 1687)`, b:`The English scientist Isaac Newton (1642–1727) published The Mathematical Principles of Natural Philosophy (the Principia) in 1687.
Major achievements: proposed Newton's laws of motion and the law of universal gravitation; discovered that white light was made up of different colours of light; invented calculus.`},
{cat:"Scientific Revolution", f:`Emergence of scientific research groups`, b:`In the 17th century, the Royal Society of Britain and the French Academy of Sciences were founded. These scientific research groups gathered scholars to conduct research and published regular journals to introduce new discoveries, facilitating academic exchanges.
Many well-known scientists were their members — for example, Isaac Newton, Albert Einstein and Stephen Hawking were all Fellows of the Royal Society.`},
{cat:"Scientific Revolution", f:`Impact 1 — Changing the understanding of Europeans`, b:`In the medieval times, religion was used to explain natural phenomena. During the Scientific Revolution, scientists discovered many laws of nature through rational thought and scientific methods. This proved that natural phenomena were not directly driven by God, and changed the world view of Europeans.
For example, they used science to explain medicine and argued that illness was not a punishment from God, but was related to the functioning of the human body.`},
{cat:"Scientific Revolution", f:`Impact 2 — Promoting innovation (Industrial Revolution)`, b:`The Scientific Revolution drew a line between science and religion. New discoveries opened up new directions for scientific research. The application of scientific methods and knowledge to industrial production led to the invention of new machines. This promoted technological innovation and brought Europe into the "Industrial Revolution".`},

// ===================== EXAM SKILL =====================
{cat:"Exam Skill", f:`Similarity between Boccaccio and Martin Luther`, b:`They both criticised the Church for its corruption/malpractices. Source A (the Decameron) shows Boccaccio described the clergy as corrupt, while Source B (the Ninety-Five Theses) shows Martin Luther criticised the sale of indulgences.`},
];

const cats = [...new Set(DECK.map(c=>c.cat))];
const sel = document.getElementById('catFilter');
cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o)});

let filtered = [...DECK];
let idx = 0;
let flipped = false;

function applyFilter(){
  const v = sel.value;
  filtered = v==='all' ? [...DECK] : DECK.filter(c=>c.cat===v);
  idx = 0; flipped = false;
  render();
}
function shuffle(){
  for(let i=filtered.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[filtered[i],filtered[j]]=[filtered[j],filtered[i]];}
  idx = 0; flipped = false; render();
}
function flip(){
  if(!filtered.length) return;
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
}
function move(d){
  if(!filtered.length) return;
  idx = (idx + d + filtered.length) % filtered.length;
  flipped = false;
  document.getElementById('card').classList.remove('flipped');
  render();
}
function render(){
  const c = filtered[idx];
  document.getElementById('catFront').textContent = c.cat;
  document.getElementById('catBack').textContent = c.cat;
  document.getElementById('q').textContent = c.f;
  document.getElementById('a').textContent = c.b;
  document.getElementById('counter').textContent = `Section ${idx+1} / ${filtered.length}`;
}
document.addEventListener('keydown', e=>{
  if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}
  else if(e.key==='ArrowRight'){move(1);}
  else if(e.key==='ArrowLeft'){move(-1);}
});
render();
</script>
</body>
</html>
